# CleanWizard — Release pipeline.
#
# Trigger policy: only a v* tag (or a manual dispatch) runs this workflow.
# Branch pushes and pull requests never start it, so CI minutes are spent on
# releases only.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        working-directory: engine
        run: cargo test --locked --all-targets

  app:
    name: App build and tests
    runs-on: macos-latest
    timeout-minutes: 45
    needs: engine
    env:
      # Runner images trail the newest Xcode; allow the available toolchain so
      # the pipeline stays green while local builds use Xcode 27.
      CW_ALLOW_OLDER_XCODE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Select Xcode
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR || true
          eval "$(scripts/xcode-env.sh)"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "${GITHUB_ENV}"
          xcodebuild -version

      - name: Build engine
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path engine/Cargo.toml \
            --target aarch64-apple-darwin

      - name: Run tests
        run: scripts/test.sh app

      - name: Build App
        run: scripts/build.sh --debug

      - name: Collect logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Package and publish
    runs-on: macos-latest
    timeout-minutes: 60
    needs: app
    env:
      CW_ALLOW_OLDER_XCODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Select Xcode
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR || true
          eval "$(scripts/xcode-env.sh)"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "${GITHUB_ENV}"

      - name: Build universal App
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path engine/Cargo.toml --target aarch64-apple-darwin
          cargo build --locked --release --manifest-path engine/Cargo.toml --target x86_64-apple-darwin
          scripts/build.sh --release --arch arm64

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Release/CleanWizard.app"
          test -d "${APP}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "dist/CleanWizard-${GITHUB_REF_NAME}.zip"
          cd dist && shasum -a 256 ./*.zip > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
